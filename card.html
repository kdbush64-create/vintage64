<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeWayne Bush · Vintage64TX</title>
<!-- cf-email-obfuscation=off -->
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500&family=Bebas+Neue&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --gold:    #F5A82A;
  --gold2:   #ffca5a;
  --green:   #22DD44;
  --green2:  #66ffaa;
  --bg:      #080810;
  --white:   #F2EEE8;
  --muted:   #777;
}

html, body {
  background: var(--bg);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 48px 20px;
  font-family: 'DM Sans', sans-serif;
  color: var(--white);
}

body::before {
  content: '';
  position: fixed; inset: 0;
  background:
    radial-gradient(ellipse 55% 45% at 15% 15%, rgba(245,168,42,0.08) 0%, transparent 70%),
    radial-gradient(ellipse 45% 40% at 85% 85%, rgba(34,221,68,0.06) 0%, transparent 70%);
  pointer-events: none;
}

.wrap {
  width: 100%;
  max-width: 380px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
}

.card {
  width: 100%;
  border-radius: 22px;
  overflow: hidden;
  background: linear-gradient(160deg, #161620 0%, #0e0e18 50%, #0a0a12 100%);
  box-shadow:
    0 0 0 1px rgba(255,255,255,0.07),
    0 32px 100px rgba(0,0,0,0.95),
    0 0 60px rgba(245,168,42,0.05);
  position: relative;
  animation: cardIn 0.8s cubic-bezier(0.16,1,0.3,1) both;
}
@keyframes cardIn {
  from { opacity: 0; transform: translateY(28px) scale(0.96); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

.orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(55px);
  pointer-events: none;
  z-index: 0;
}
.orb-1 { width:280px; height:240px; top:-80px; left:-80px;
  background: radial-gradient(circle, rgba(245,168,42,0.16) 0%, transparent 70%); }
.orb-2 { width:220px; height:200px; bottom:-60px; right:-50px;
  background: radial-gradient(circle, rgba(34,221,68,0.11) 0%, transparent 70%); }

/* ── LIVING LIGHT BAR ── */
.life-bar {
  position: relative;
  width: 100%;
  height: 3px;
  z-index: 10;
  flex-shrink: 0;
}
.life-bar canvas {
  display: block;
  width: 100%;
  height: 3px;
}
.life-bar::after {
  content: '';
  position: absolute;
  top: 0; left: 10%; right: 10%;
  height: 22px;
  filter: blur(10px);
  opacity: 0.5;
  pointer-events: none;
  background: var(--bar-glow, rgba(245,168,42,0.4));
}

.card-body {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  padding: 36px 36px 32px;
}

.brand { margin-bottom: 28px; animation: fadeUp 0.6s 0.1s both cubic-bezier(0.16,1,0.3,1); }
@keyframes fadeUp {
  from { opacity:0; transform:translateY(14px); }
  to   { opacity:1; transform:translateY(0); }
}

.brand-name {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 52px;
  letter-spacing: 6px;
  line-height: 1;
  display: inline-flex;
  align-items: baseline;
}
.bn-gold {
  background: linear-gradient(135deg, var(--gold) 0%, var(--gold2) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.bn-green {
  background: linear-gradient(135deg, var(--green) 0%, var(--green2) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  filter: drop-shadow(0 0 10px rgba(34,221,68,0.55));
}
.brand-sub {
  margin-top: 7px;
  font-size: 9px;
  font-weight: 500;
  letter-spacing: 3.5px;
  text-transform: uppercase;
  color: rgba(245,168,42,0.4);
}

.rule {
  height: 1px;
  background: linear-gradient(90deg, var(--gold) 0%, rgba(245,168,42,0.08) 70%, transparent 100%);
  margin-bottom: 24px;
  animation: fadeUp 0.6s 0.15s both cubic-bezier(0.16,1,0.3,1);
}

.person { animation: fadeUp 0.6s 0.2s both cubic-bezier(0.16,1,0.3,1); }
.person-name {
  font-family: 'Playfair Display', serif;
  font-size: 30px;
  font-weight: 700;
  color: var(--white);
  letter-spacing: 0.5px;
  line-height: 1.1;
}
.person-creds {
  margin-top: 6px;
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  color: var(--gold);
  opacity: 0.85;
}
.person-role {
  margin-top: 3px;
  font-size: 9.5px;
  font-weight: 300;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--muted);
}

.spacer { height: 20px; }

.contacts {
  display: flex;
  flex-direction: column;
  gap: 11px;
  animation: fadeUp 0.6s 0.3s both cubic-bezier(0.16,1,0.3,1);
}
.c-row {
  display: flex;
  align-items: center;
  gap: 13px;
  text-decoration: none;
  color: inherit;
  transition: transform 0.2s;
}
.c-row:hover { transform: translateX(4px); }
.c-row:hover .c-val { color: var(--gold2); }

.c-pill {
  width: 30px; height: 30px;
  border-radius: 8px;
  background: rgba(34,221,68,0.07);
  border: 1px solid rgba(34,221,68,0.18);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: background 0.2s, border-color 0.2s;
}
.c-row:hover .c-pill {
  background: rgba(34,221,68,0.15);
  border-color: rgba(34,221,68,0.4);
}
.c-pill svg {
  width: 13px; height: 13px;
  fill: none;
  stroke: var(--green);
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
  filter: drop-shadow(0 0 4px rgba(34,221,68,0.6));
}
.c-lbl {
  font-size: 7.5px;
  font-weight: 600;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  color: rgba(255,255,255,0.22);
  display: block;
  line-height: 1;
}
.c-val {
  font-size: 12px;
  font-weight: 400;
  color: rgba(242,238,232,0.82);
  letter-spacing: 0.2px;
  transition: color 0.2s;
}

.qr-section {
  margin-top: 28px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  animation: fadeUp 0.6s 0.4s both cubic-bezier(0.16,1,0.3,1);
}
.qr-label {
  font-size: 8px;
  font-weight: 600;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: rgba(255,255,255,0.28);
}
.qr-glass {
  position: relative;
  padding: 10px;
  background: #fff;
  border-radius: 12px;
  box-shadow: 0 0 0 1px rgba(245,168,42,0.25), 0 8px 28px rgba(0,0,0,0.5);
}
.qr-glass::before {
  content: '';
  position: absolute;
  inset: -2px;
  border-radius: 14px;
  background: conic-gradient(from 0deg, var(--gold), var(--green), var(--gold2), var(--gold), var(--green), var(--gold));
  z-index: -1;
  animation: spin 5s linear infinite;
  opacity: 0.55;
}
@keyframes spin { to { transform: rotate(360deg); } }
#qrcode canvas, #qrcode img { display: block; border-radius: 4px; }

.qr-hint { font-size: 8px; font-weight: 500; letter-spacing: 2px; text-transform: uppercase; text-align: center; }
.qr-hint-top { color: var(--green); opacity: 0.85; }
.qr-hint-bot { color: rgba(255,255,255,0.18); margin-top: 2px; }

.card-footer {
  position: relative;
  z-index: 2;
  border-top: 1px solid rgba(255,255,255,0.05);
  padding: 12px 36px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: rgba(0,0,0,0.25);
}
.foot-logo {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 12px;
  letter-spacing: 4px;
  display: inline-flex;
  align-items: baseline;
  opacity: 0.55;
}
.fl-gold {
  background: linear-gradient(90deg, var(--gold), var(--gold2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.fl-green {
  -webkit-text-fill-color: var(--green);
  color: var(--green);
  filter: drop-shadow(0 0 5px rgba(34,221,68,0.5));
}
.foot-loc {
  font-size: 8.5px;
  font-weight: 400;
  letter-spacing: 1.5px;
  color: rgba(255,255,255,0.18);
}

.actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  justify-content: center;
  animation: fadeUp 0.6s 0.5s both cubic-bezier(0.16,1,0.3,1);
}
.btn {
  font-family: 'DM Sans', sans-serif;
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.8px;
  padding: 11px 24px;
  border-radius: 100px;
  border: none;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  transition: all 0.22s cubic-bezier(0.16,1,0.3,1);
  text-decoration: none;
}
.btn-primary {
  background: linear-gradient(135deg, var(--gold) 0%, var(--gold2) 100%);
  color: #000;
  box-shadow: 0 4px 18px rgba(245,168,42,0.35);
}
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 26px rgba(245,168,42,0.5); }
.btn-ghost {
  background: rgba(255,255,255,0.05);
  color: rgba(255,255,255,0.45);
  border: 1px solid rgba(255,255,255,0.1);
}
.btn-ghost:hover { background: rgba(255,255,255,0.09); color: rgba(255,255,255,0.75); transform: translateY(-2px); }

@media print {
  html, body, .wrap, .card, .card-body, .card-footer,
  .brand, .rule, .person, .contacts, .c-row, .c-pill,
  .qr-section, .qr-glass, .foot-logo, .foot-loc, .life-bar, .orb {
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
  }
  html, body {
    height: auto !important;
    min-height: 0 !important;
    padding: 16px 0 0 0 !important;
    margin: 0 !important;
    background: var(--bg) !important;
  }
  .wrap {
    min-height: 0 !important;
    padding: 0 !important;
    gap: 0 !important;
  }
  .actions { display: none !important; }
  .card {
    box-shadow: none !important;
    page-break-after: avoid !important;
    break-after: avoid !important;
    background: linear-gradient(160deg, #161620 0%, #0e0e18 50%, #0a0a12 100%) !important;
  }
  * { page-break-after: avoid !important; break-after: avoid !important; }
}
</style>
</head>
<body>

<div class="wrap">
  <div class="card">

    <div class="life-bar"><canvas id="lifeBar"></canvas></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="card-body">

      <div class="brand">
        <div class="brand-name">
          <span class="bn-gold">VINTAGE</span><span class="bn-green">64</span><span class="bn-gold">TX</span>
        </div>
        <div class="brand-sub">Vintage Computing &amp; Technology Solutions</div>
      </div>

      <div class="rule"></div>

      <div class="person">
        <div class="person-name">DeWayne Bush</div>
        <div class="person-creds">MSITM &nbsp;·&nbsp; CIOS &nbsp;·&nbsp; CSIS &nbsp;·&nbsp; CSPO</div>
        <div class="person-role">Founder &amp; Principal</div>
      </div>

      <div class="spacer"></div>

      <div class="contacts">

        <a class="c-row" href="https://vintage64tx.com" target="_blank">
          <div class="c-pill">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
          </div>
          <div>
            <span class="c-lbl">Website</span>
            <span class="c-val">vintage64tx.com</span>
          </div>
        </a>

        <a class="c-row" id="emailLink" href="#">
          <div class="c-pill">
            <svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 7 10 7 10-7"/></svg>
          </div>
          <div>
            <span class="c-lbl">Email</span>
            <span class="c-val" id="emailVal"></span>
          </div>
        </a>

        <a class="c-row" href="tel:+14696659191">
          <div class="c-pill">
            <svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.6 1.27h3a2 2 0 0 1 2 1.72c.1.96.38 1.9.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.9a16 16 0 0 0 6 6l.91-.91a2 2 0 0 1 2.11-.45c.91.32 1.85.6 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
          </div>
          <div>
            <span class="c-lbl">Phone / Text</span>
            <span class="c-val">469-665-9191</span>
          </div>
        </a>

      </div>

      <div class="qr-section">
        <div class="qr-label">Save Contact</div>
        <div class="qr-glass">
          <div id="qrcode"></div>
        </div>
        <div class="qr-hint">
          <div class="qr-hint-top">Scan to Save</div>
          <div class="qr-hint-bot">Downloads vCard</div>
        </div>
      </div>

    </div>

    <div class="card-footer">
      <div class="foot-logo">
        <span class="fl-gold">VINTAGE</span><span class="fl-green">64</span><span class="fl-gold">TX</span>
      </div>
      <div class="foot-loc">Fort Worth, TX</div>
    </div>

  </div>

  <div class="actions">
    <button class="btn btn-primary" onclick="downloadVCard()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Download Contact
    </button>
    <button class="btn btn-ghost" onclick="window.print()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
      Print / Save PDF
    </button>
  </div>

</div>

<script>
// Build email from parts so Cloudflare's bot can't mangle the href
(function() {
  var u = 'dewayne', d = 'vintage64tx.com';
  var e = u + '@' + d;
  var el = document.getElementById('emailLink');
  var ev = document.getElementById('emailVal');
  el.href = 'mailto:' + e;
  ev.textContent = e;
})();

/* ── vCard ── */
var EMAIL = 'dewayne' + '@' + 'vintage64tx.com';

var vcard = [
  "BEGIN:VCARD",
  "VERSION:3.0",
  "FN:DeWayne Bush",
  "N:Bush;DeWayne;;;",
  "ORG:Vintage64TX",
  "TITLE:Founder & Principal",
  "NOTE:MSITM CIOS CSIS CSPO",
  "TEL;TYPE=CELL,VOICE,MSG:+14696659191",
  "EMAIL;TYPE=INTERNET,WORK:" + EMAIL,
  "URL:https://vintage64tx.com",
  "ADR;TYPE=WORK:;;Fort Worth;TX;;;US",
  "END:VCARD"
].join("\r\n");

new QRCode(document.getElementById("qrcode"), {
  text: vcard,
  width: 130,
  height: 130,
  colorDark: "#08080f",
  colorLight: "#ffffff",
  correctLevel: QRCode.CorrectLevel.M
});

function downloadVCard() {
  var blob = new Blob([vcard], { type: "text/vcard;charset=utf-8" });
  var url  = URL.createObjectURL(blob);
  var a    = document.createElement("a");
  a.href = url;
  a.download = "DeWayne_Bush_Vintage64TX.vcf";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ── LIVING LIGHT BAR ── */
(function () {
  var canvas = document.getElementById('lifeBar');
  var bar    = canvas.parentElement;
  var card   = canvas.closest('.card');

  function resize() {
    canvas.width  = card.offsetWidth;
    canvas.height = 3;
  }
  resize();
  window.addEventListener('resize', resize);

  var ctx = canvas.getContext('2d');

  var palette = [
    [245, 168,  42],
    [255, 202,  90],
    [255, 140,  18],
    [ 34, 221,  68],
    [102, 255, 170],
    [245, 168,  42],
    [255, 202,  90],
  ];

  var BLOBS = 11;
  var blobs = [];
  for (var i = 0; i < BLOBS; i++) {
    blobs.push({
      x:        (i / BLOBS) * 1.3 - 0.15,
      speed:    (0.00015 + Math.random() * 0.00025) * (Math.random() < 0.5 ? 1 : -1),
      w:        0.07 + Math.random() * 0.20,
      phase:    Math.random() * Math.PI * 2,
      phaseSpd: 0.007 + Math.random() * 0.013,
      cA:       Math.floor(Math.random() * palette.length),
      cB:       Math.floor(Math.random() * palette.length),
      cT:       Math.random(),
      cSpd:     0.0018 + Math.random() * 0.0035,
      alpha:    0.5 + Math.random() * 0.5,
    });
  }

  function lerp(a, b, t) {
    return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t];
  }

  var t = 0;

  function draw() {
    var W = canvas.width, H = canvas.height;
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(8,8,16,0.9)';
    ctx.fillRect(0, 0, W, H);

    var bR = 8, bG = 8, bB = 16;

    for (var bi = 0; bi < blobs.length; bi++) {
      var b = blobs[bi];
      b.x      += b.speed;
      b.phase  += b.phaseSpd;
      b.cT     += b.cSpd;
      if (b.x >  1.3) b.x = -0.3;
      if (b.x < -0.3) b.x =  1.3;
      if (b.cT >= 1) { b.cT = 0; b.cA = b.cB; b.cB = Math.floor(Math.random() * palette.length); }

      var px    = (b.x + Math.sin(t * 0.00028 + b.phase) * 0.035 + Math.sin(t * 0.00067 + b.phase * 1.4) * 0.018) * W;
      var pw    = b.w * W;
      var pulse = 0.55 + 0.45 * Math.sin(b.phase);
      var col   = lerp(palette[b.cA], palette[b.cB], b.cT);
      var al    = b.alpha * pulse;

      bR += col[0] * al * 0.08;
      bG += col[1] * al * 0.08;
      bB += col[2] * al * 0.08;

      var g = ctx.createRadialGradient(px, H/2, 0, px, H/2, pw/2);
      g.addColorStop(0,   'rgba('+Math.floor(col[0])+','+Math.floor(col[1])+','+Math.floor(col[2])+','+al+')');
      g.addColorStop(0.4, 'rgba('+Math.floor(col[0])+','+Math.floor(col[1])+','+Math.floor(col[2])+','+(al*0.5)+')');
      g.addColorStop(1,   'rgba('+Math.floor(col[0])+','+Math.floor(col[1])+','+Math.floor(col[2])+',0)');

      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.ellipse(px, H/2, pw/2, H * 1.3, 0, 0, Math.PI*2);
      ctx.fill();
      ctx.restore();
    }

    var fade = ctx.createLinearGradient(0, 0, W, 0);
    fade.addColorStop(0,    'rgba(8,8,16,1)');
    fade.addColorStop(0.03, 'rgba(8,8,16,0)');
    fade.addColorStop(0.97, 'rgba(8,8,16,0)');
    fade.addColorStop(1,    'rgba(8,8,16,1)');
    ctx.fillStyle = fade;
    ctx.fillRect(0, 0, W, H);

    var r = Math.min(255, Math.floor(bR));
    var gv= Math.min(255, Math.floor(bG));
    var bv= Math.min(255, Math.floor(bB));
    bar.style.setProperty('--bar-glow', 'rgba('+r+','+gv+','+bv+',0.45)');

    t++;
    requestAnimationFrame(draw);
  }

  draw();
})();
</script>

</body>
</html>
